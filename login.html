
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Campus Voice</title>

    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>

        body {

            min-height:100vh;

            background:
                linear-gradient(rgba(13,59,102,0.88), rgba(13,59,102,0.88)),
                url("talk-to-us.png");

            background-size:cover;
            background-position:center;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:20px;

            font-family:'Segoe UI',sans-serif;
        }

        .login-card {

            width:100%;
            max-width:1000px;

            overflow:hidden;

            border-radius:30px;

            background:rgba(255,255,255,0.12);

            backdrop-filter:blur(18px);

            box-shadow:0 15px 40px rgba(0,0,0,0.25);
        }

        .left-side {

            padding:60px;
            color:white;
        }

        .left-side h1 {

            font-size:3rem;
            font-weight:bold;
        }

        .right-side {

            background:white;
            padding:50px;
        }

        .form-control {

            border-radius:14px;
            padding:14px;
        }

        .form-control:focus {

            box-shadow:none;
            border-color:#2bbcd3;
        }

        .main-btn {

            background:#2bbcd3;
            border:none;

            padding:14px;

            width:100%;

            border-radius:14px;

            color:white;

            font-weight:600;
        }

        .main-btn:hover {

            background:#24a6bb;
        }

    </style>

</head>

<body>

    <div class="login-card">

        <div class="row g-0">

            <div class="col-lg-5">

                <div class="left-side">

                    <h1>
                        Welcome Back
                    </h1>

                    <p class="mt-4">
                        Continue improving campus life through smart and transparent issue reporting.
                    </p>

                </div>

            </div>

            <div class="col-lg-7">

                <div class="right-side">

                    <h3 class="fw-bold mb-4">
                        Student Login
                    </h3>

                    <form id="loginForm">

                        <div class="mb-3">

                            <input
                            type="text"
                            id="student_id"
                            class="form-control"
                            placeholder="Student ID"
                            required>

                        </div>

                        <div class="mb-4">

                            <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Password"
                            required>

                        </div>

                        <button type="submit" class="main-btn">
                            Login
                        </button>

                        <div class="text-center mt-4">

                            Don't have an account?

                            <a href="index.html">
                                Register
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword
        }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc
        }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {

            apiKey: "AIzaSyAbaeZwRPsO8MoeQ3iWsrcY-mqvpT4xhgc",

            authDomain: "campus-voice-3de0b.firebaseapp.com",

            projectId: "campus-voice-3de0b",

            storageBucket: "campus-voice-3de0b.firebasestorage.app",

            messagingSenderId: "788646502212",

            appId: "1:788646502212:web:d0aea180d70c0f59538111"

        };

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);

        document.getElementById("loginForm")
        .addEventListener("submit", async (e) => {

            e.preventDefault();

            const student_id =
                document.getElementById("student_id").value;

            const password =
                document.getElementById("password").value;

            try {

                const docRef =
                    doc(db, "students", student_id);

                const docSnap =
                    await getDoc(docRef);

                if(!docSnap.exists()){

                    alert("Student not found");

                    return;
                }

                const email = docSnap.data().email;

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                window.location.href = "home.html";

            } catch(error){

                console.log(error);

                alert(error.message);
            }

        });

    </script>

</body>

</html>
