<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Voice Admin Dashboard</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <!-- Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #dceef2, #edf5f6);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .dashboard-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(18px);
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            padding: 25px 20px;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            color: #0d3b66;
            margin-bottom: 40px;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 14px;
            text-decoration: none;
            color: #0d3b66;
            margin-bottom: 10px;
            transition: 0.3s;
            font-weight: 500;
        }

        .menu-link:hover,
        .menu-link.active {
            background: #2bbcd3;
            color: white;
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            padding: 30px;
        }

        /* TOP BAR */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .search-box {
            background: white;
            padding: 12px 18px;
            border-radius: 14px;
            width: 350px;
            border: none;
            outline: none;
        }

        .profile-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-avatar {
            width: 45px;
            height: 45px;
            background: #2bbcd3;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }

        /* STATS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px);
            border-radius: 22px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .stat-card h3 {
            color: #0d3b66;
            font-size: 15px;
        }

        .stat-card h1 {
            margin-top: 12px;
            color: #2bbcd3;
            font-size: 38px;
            font-weight: bold;
        }

        /* REPORTS TABLE */
        .reports-container {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px);
            border-radius: 25px;
            padding: 25px;
        }

        .report-card {
            background: white;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 16px;
            transition: 0.3s;
        }

        .report-card:hover {
            transform: translateY(-4px);
        }

        .status-badge {
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: white;
        }

        .review {
            background: #ffc107;
        }

        .pending {
            background: #fd7e14;
        }

        .resolved {
            background: #28a745;
        }

        .action-btn {
            border: none;
            padding: 8px 14px;
            border-radius: 12px;
            color: white;
            font-size: 13px;
            margin-right: 5px;
        }

        .btn-review {
            background: #ffc107;
        }

        .btn-pending {
            background: #fd7e14;
        }

        .btn-resolved {
            background: #28a745;
        }

        @media(max-width: 992px) {
            .sidebar {
                display: none;
            }

            .search-box {
                width: 100%;
            }

            .topbar {
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard-wrapper">

        <!-- SIDEBAR -->
        <div class="sidebar">

            <div class="brand">
                Campus Voice
            </div>

            <a href="#" class="menu-link active">
                <i class="fa-solid fa-chart-line"></i>
                Dashboard
            </a>

            <a href="#" class="menu-link">
                <i class="fa-solid fa-file-lines"></i>
                Reports
            </a>

            <a href="#" class="menu-link">
                <i class="fa-solid fa-clock"></i>
                Pending Issues
            </a>

            <a href="#" class="menu-link">
                <i class="fa-solid fa-eye"></i>
                Under Review
            </a>

            <a href="#" class="menu-link">
                <i class="fa-solid fa-circle-check"></i>
                Resolved
            </a>

            <a href="#" class="menu-link">
                <i class="fa-solid fa-bell"></i>
                Notifications
            </a>

            <a href="#" class="menu-link">
                <i class="fa-solid fa-users"></i>
                Students
            </a>

            <a href="#" class="menu-link">
                <i class="fa-solid fa-gear"></i>
                Settings
            </a>

        </div>

        <!-- MAIN -->
        <div class="main-content">

            <!-- TOPBAR -->
            <div class="topbar">

                <input type="text" placeholder="Search reports..." class="search-box">

                <div class="profile-box">
                    <i class="fa-solid fa-bell fa-xl text-secondary"></i>

                    <div class="profile-avatar" id="adminAvatar">
                        AD
                    </div>
                </div>

            </div>

            <!-- STATS -->
            <div class="stats-grid">

                <div class="stat-card">
                    <h3>Total Reports</h3>
                    <h1 id="totalReports">0</h1>
                </div>

                <div class="stat-card">
                    <h3>Anonymous Reports</h3>
                    <h1 id="anonymousReports">0</h1>
                </div>

                <div class="stat-card">
                    <h3>Pending</h3>
                    <h1 id="pendingReports">0</h1>
                </div>

                <div class="stat-card">
                    <h3>Resolved</h3>
                    <h1 id="resolvedReports">0</h1>
                </div>

            </div>

            <!-- REPORTS -->
            <div class="reports-container">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3>Student Reports</h3>
                </div>

                <div id="reportsWrapper"></div>

            </div>

        </div>

    </div>

    <!-- FIREBASE + JS -->
    <script type="module">

        // =====================================================
        // FIREBASE IMPORTS
        // =====================================================

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

       import {
                getFirestore,
                collection,
                onSnapshot,
                doc,
                updateDoc,
                serverTimestamp,
                addDoc,
                query,
                orderBy
            }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // =====================================================
        // FIREBASE CONFIG
        // =====================================================

        const firebaseConfig = {

    apiKey: "AIzaSyAbaeZwRPsO8MoeQ3iWsrcY-mqvpT4xhgc",

    authDomain: "campus-voice-3de0b.firebaseapp.com",

    projectId: "campus-voice-3de0b",

    storageBucket: "campus-voice-3de0b.firebasestorage.app",

    messagingSenderId: "788646502212",

    appId: "1:788646502212:web:d0aea180d70c0f59538111"

};

        // =====================================================
        // INITIALIZE
        // =====================================================

        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);

        

        // =====================================================
        // REFERENCES
        // =====================================================

        const reportsWrapper = document.getElementById("reportsWrapper");

        const totalReports = document.getElementById("totalReports");

        const anonymousReports = document.getElementById("anonymousReports");

        const pendingReports = document.getElementById("pendingReports");

        const resolvedReports = document.getElementById("resolvedReports");

        // =====================================================
        // REALTIME REPORTS
        // =====================================================

        const reportsQuery = query(
            collection(db, "reports"),
            orderBy("createdAt", "desc")
        );

        onSnapshot(reportsQuery, (snapshot) => {

            reportsWrapper.innerHTML = "";

            let total = 0;

            let anonymous = 0;

            let pending = 0;

            let resolved = 0;

            snapshot.forEach((docSnap) => {

                total++;

                const report = docSnap.data();

                const reportId = docSnap.id;

                if (report.anonymous === true) {
                    anonymous++;
                }

                if (report.status === "pending") {
                    pending++;
                }

                if (report.status === "resolved") {
                    resolved++;
                }

                let badgeClass = "";

                if (report.status === "review") {
                    badgeClass = "review";
                }

                if (report.status === "pending") {
                    badgeClass = "pending";
                }

                if (report.status === "resolved") {
                    badgeClass = "resolved";
                }

                reportsWrapper.innerHTML += `

                    <div class="report-card">

                        <div class="d-flex justify-content-between flex-wrap gap-3">

                            <div>

                                <h5>${report.title}</h5>

                                <p class="mb-1">
                                    <strong>Student:</strong>
                                    ${report.anonymous ? "Anonymous" : report.studentName}
                                </p>

                                <p class="mb-1">
                                    <strong>Category:</strong>
                                    ${report.category}
                                </p>

                                <p class="mb-0">
                                    ${report.description}
                                </p>

                            </div>

                            <div class="text-end">

                                <span class="status-badge ${badgeClass}">
                                    ${report.status.toUpperCase()}
                                </span>

                                <div class="mt-3">

                                    <button
                                        class="action-btn btn-review"
                                        onclick="updateStatus('${reportId}','review','${report.studentId}')">
                                        Review
                                    </button>

                                    <button
                                        class="action-btn btn-pending"
                                        onclick="updateStatus('${reportId}','pending','${report.studentId}')">
                                        Pending
                                    </button>

                                    <button
                                        class="action-btn btn-resolved"
                                        onclick="updateStatus('${reportId}','resolved','${report.studentId}')">
                                        Resolve
                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>

                `;
            });

                        totalReports.textContent = total;

                        anonymousReports.textContent = anonymous;

                        pendingReports.textContent = pending;

                        resolvedReports.textContent = resolved;

                    });

                    // =====================================================
                    // UPDATE STATUS
                    // =====================================================

                    window.updateStatus = async (
                        reportId,
                        status,
                        studentId
                    ) => {

                        try {

                            // UPDATE REPORT STATUS
                            await updateDoc(
                                doc(db, "reports", reportId),
                                {
                                    status: status,
                                    updatedAt: serverTimestamp()
                                }
                            );

                            // CREATE NOTIFICATION
                            let message = "";

                            if (status === "review") {
                                message = "Your report is currently under review.";
                            }

                            if (status === "pending") {
                                message = "Your report is pending resolution.";
                            }

                            if (status === "resolved") {
                                message = "Your issue has been resolved successfully.";
                            }

                            await addDoc(
                                collection(db, "notifications"),
                                {
                                    studentId: studentId,
                                    message: message,
                                    status: status,
                                    read: false,
                                    createdAt: serverTimestamp()
                                }
                            );

                            alert("Status updated successfully!");

                        } catch (error) {

                            console.log(error);

                            alert(error.message);

                        }

                    };

                    

    

    </script>

</body>

</html>
