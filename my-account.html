<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>

    <!-- Bootstrap -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: #f4f4f4;
            font-family: 'Segoe UI', sans-serif;
        }

        .settings-card {
            background: white;
            border-radius: 8px;
            padding: 40px;
            margin-top: 60px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .profile-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
        }

        .change-btn {
            width: 150px;
        }

        .label-text {
            font-size: 12px;
            color: gray;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .form-control {
            border: none;
            border-bottom: 1px solid #ddd;
            border-radius: 0;
            padding-left: 0;
            background: transparent;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #2bbcd3;
        }

        .save-btn {
            background: #2bbcd3;
            border: none;
            padding: 10px 35px;
        }

        .save-btn:hover {
            background: #24a6bb;
        }

        .tab-link {
            font-size: 13px;
            font-weight: 600;
            color: gray;
        }

        .tab-link.active {
            color: #2bbcd3 !important;
            border-bottom: 2px solid #2bbcd3 !important;
        }

        .check-icon {
            color: #2ecc71;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-10">

                <!-- WHITE CANVAS -->
                <div class="settings-card">

                    <!-- Header -->
                    <div class="d-flex justify-content-between align-items-center mb-4">

                        <h2 class="fw-light">My Account</h2>

                        <button class="btn-close" onclick="window.location.href='home.html'"></button>

                    </div>

                    <!-- Tabs -->
                    <ul class="nav nav-tabs border-0 mb-5">

                        <li class="nav-item">
                            <a class="nav-link active tab-link" href="#">
                                PROFILE
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link tab-link" href="#">
                                My-Reports
                            </a>
                        </li>

                    </ul>

                    <!-- CONTENT -->
                    <div class="row">

                        <!-- LEFT -->
                        <div class="col-md-4 text-center mb-4">

                            <img src="daniel.png" class="profile-img mb-4" alt="profile">

                            <br>

                            <button class="btn btn-outline-primary change-btn">
                                CHANGE
                            </button>

                        </div>

                        <!-- RIGHT -->
                        <div class="col-md-8">

                            <!-- NAME -->
                            <div class="row align-items-center mb-4">

                                <div class="col-3">
                                    <span class="label-text">
                                        NAME
                                    </span>
                                </div>

                                <div class="col-8">
                                    <input type="text" class="form-control" id="nameInput" value="">
                                </div>

                                <div class="col-1">
                                    <i class="bi bi-check-lg check-icon"></i>
                                </div>

                            </div>

                            <!-- EMAIL -->
                            <div class="row align-items-center mb-4">

                                <div class="col-3">
                                    <span class="label-text">
                                        EMAIL
                                    </span>
                                </div>

                                <div class="col-8">
                                    <input type="email" id="emailInput" class="form-control" value="">
                                </div>

                                <div class="col-1">
                                    <i class="bi bi-check-lg check-icon"></i>
                                </div>

                            </div>

                            <!-- PHONE -->
                            <div class="row align-items-center mb-4">

                                <div class="col-3">
                                    <span class="label-text">
                                        PHONE
                                    </span>
                                </div>

                                <div class="col-8">
                                    <input id="phoneInput" type="text" class="form-control" value="">
                                </div>

                                <div class="col-1">
                                    <i class="bi bi-check-lg check-icon"></i>
                                </div>

                            </div>

                            <!-- COURSE -->
                            <div class="row align-items-center mb-4">

                                <div class="col-3">
                                    <span class="label-text">
                                        COURSE
                                    </span>
                                </div>

                                <div class="col-8">
                                    <input id="courseInput" type="text" class="form-control" value="">
                                </div>

                                <div class="col-1">
                                    <i class="bi bi-pencil"></i>
                                </div>

                            </div>

                            <!-- PASSWORD -->
                            <div class="row align-items-center mb-4">

                                <div class="col-3">
                                    <span class="label-text">
                                        PASSWORD
                                    </span>
                                </div>

                                <div class="col-8">
                                    <input id="passwordInput" type="password" class="form-control" value="">
                                </div>

                                <div class="col-1">
                                    <i class="bi bi-check-lg check-icon"></i>
                                </div>

                            </div>

                            <!-- CONFIRM PASSWORD -->
                            <div class="row align-items-center mb-5">

                                <div class="col-3">
                                    <span class="label-text">
                                        CONFIRM
                                    </span>
                                </div>

                                <div class="col-8">
                                    <input type="password" class="form-control">
                                </div>

                                <div class="col-1">
                                    <i class="bi bi-check-lg check-icon"></i>
                                </div>

                            </div>

                            <!-- SAVE BUTTON -->
                            <div class="text-center">

                                <button id="saveBtn" class="btn save-btn text-white">
                                    SAVE
                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
    <!-- FIREBASE SCRIPT -->
    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        import {
            getFirestore,
            collection,
            query,
            where,
            getDocs,
            doc,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        // FIREBASE CONFIG
        const firebaseConfig = {

            apiKey: "AIzaSyAbaeZwRPsO8MoeQ3iWsrcY-mqvpT4xhgc",

            authDomain: "campus-voice-3de0b.firebaseapp.com",

            projectId: "campus-voice-3de0b",

            storageBucket: "campus-voice-3de0b.firebasestorage.app",

            messagingSenderId: "788646502212",

            appId: "1:788646502212:web:d0aea180d70c0f59538111"

        };


        // INITIALIZE
        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);


        // CHECK LOGGED IN USER
        onAuthStateChanged(auth, async (user) => {

            if (user) {

                // FIND USER IN FIRESTORE
                const q = query(
                    collection(db, "students"),
                    where("uid", "==", user.uid)
                );

                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {

                    const userData = querySnapshot.docs[0].data();

                    // INSERT DATA INTO INPUTS
                    document.getElementById("nameInput").value =
                        userData.full_name || "";

                    document.getElementById("emailInput").value =
                        userData.email || "";

                    document.getElementById("phoneInput").value =
                        userData.phone || "";

                    document.getElementById("courseInput").value =
                        userData.course || "";

                }

            } else {

                // REDIRECT IF NOT LOGGED IN
                window.location.href = "login.html";

            }

        });

        // SAVE PROFILE CHANGES
        document.getElementById("saveBtn").addEventListener("click", async () => {

            const user = auth.currentUser;

            if (!user) return;

            try {

                // FIND CURRENT USER DOCUMENT
                const q = query(
                    collection(db, "students"),
                    where("uid", "==", user.uid)
                );

                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {

                    const docId = querySnapshot.docs[0].id;

                    // GET INPUT VALUES
                    const updatedName =
                        document.getElementById("nameInput").value;

                    const updatedEmail =
                        document.getElementById("emailInput").value;

                    const updatedPhone =
                        document.getElementById("phoneInput").value;

                    const updatedCourse =
                        document.getElementById("courseInput").value;

                    // UPDATE FIRESTORE
                    await updateDoc(doc(db, "students", docId), {

                        full_name: updatedName,
                        email: updatedEmail,
                        phone: updatedPhone,
                        course: updatedCourse

                    });

                    alert("Profile updated successfully!");

                }

            } catch (error) {

                console.log(error);
                alert("Failed to update profile");

            }

        });

    </script>

    <script src="js/bootstrap.min.js"></script>

</body>

</html>
