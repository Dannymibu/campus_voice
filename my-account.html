    <script type="module">


        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

            authDomain: "campus-voice-3de0b.firebaseapp.com",

            projectId: "campus-voice-3de0b",

            storageBucket: "campus-voice-3de0b.firebasestorage.app",

            messagingSenderId: "788646502212",

            appId: "1:788646502212:web:d0aea180d70c0f59538111"

        };


        // INITIALIZE
        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);

       const reportsWrapper =
        document.getElementById("reportsWrapper");

        const notificationsWrapper =
            document.getElementById("notificationsWrapper");

        //we are now adding the updated code


        const storage = getStorage(app);


        // CHECK LOGGED IN USER
        onAuthStateChanged(auth, async (user) => {

            if (user) {

                // FIND USER IN FIRESTORE
                const q = query(
                    collection(db, "students"),
                    where("uid", "==", user.uid)
                );

                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {

                    const userData = querySnapshot.docs[0].data();

                    // INSERT DATA INTO INPUTS
                    // INSERT DATA INTO INPUTS
                    document.getElementById("nameInput").value =
                        userData.full_name || "";

                    document.getElementById("emailInput").value =
                        userData.email || "";

                    document.getElementById("phoneInput").value =
                        userData.phone || "";

                    document.getElementById("courseInput").value =
                        userData.course || "";


                    // CREATE INITIALS AVATAR
                    const fullName = userData.full_name || "";

                    const nameParts = fullName.split(" ");

                    const initials =
                        nameParts[0].charAt(0) +
                        (nameParts[1] ? nameParts[1].charAt(0) : "");


                }

            } else {

                // REDIRECT IF NOT LOGGED IN
                window.location.href = "login.html";

            }

        });

        // SAVE PROFILE CHANGES
        document.getElementById("saveBtn").addEventListener("click", async () => {

            const user = auth.currentUser;

            if (!user) return;

            try {

                // FIND CURRENT USER DOCUMENT
                const q = query(
                    collection(db, "students"),
                    where("uid", "==", user.uid)
                );

                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {

                    const docId = querySnapshot.docs[0].id;

                    // GET INPUT VALUES
                    const updatedName =
                        document.getElementById("nameInput").value;

                    const updatedEmail =
                        document.getElementById("emailInput").value;

                    const updatedPhone =
                        document.getElementById("phoneInput").value;

                    const updatedCourse =
                        document.getElementById("courseInput").value;

                    // UPDATE FIRESTORE
                    await updateDoc(doc(db, "students", docId), {

                        full_name: updatedName,
                        email: updatedEmail,
                        phone: updatedPhone,
                        course: updatedCourse

                    });

                    alert("Profile updated successfully!");

                }

            } catch (error) {

                console.log(error);
                alert("Failed to update profile");

            }

        });

const profileTab =

// SHOW PROFILE
profileTab.addEventListener("click", () => {

    profileTab.classList.add("active");
    reportsTab.classList.remove("active");

    profileSection.style.display = "block";

    reportsSection.style.display = "none";

    notificationsSection.style.display = "none";

// SHOW REPORTS + NOTIFICATIONS
reportsTab.addEventListener("click", () => {

    reportsTab.classList.add("active");
    profileTab.classList.remove("active");

    profileSection.style.display = "none";

    reportsSection.style.display = "block";

    notificationsSection.style.display = "block";

});

// =====================================================
// MY REPORTS REALTIME LOADER
// =====================================================



onAuthStateChanged(auth, (user) => {

    if (!user) {

        window.location.href = "login.html";

        return;
    }

    const reportsQuery = query(

        collection(db, "reports"),

        where("studentId", "==", user.uid),

        orderBy("createdAt", "desc")

    );

    onSnapshot(reportsQuery, (snapshot) => {

        reportsWrapper.innerHTML = "";

        if (snapshot.empty) {

            reportsWrapper.innerHTML = `

                <div class="alert alert-info rounded-4">

                    You have not submitted any reports yet.

                </div>

            `;

            return;
        }

        snapshot.forEach((docSnap) => {

            const report = docSnap.data();

            let badgeClass = "";

            if (report.status === "review") {

                badgeClass = "review";

            } else if (report.status === "pending") {

                badgeClass = "pending";

            } else if (report.status === "resolved") {

                badgeClass = "resolved";
            }

            reportsWrapper.innerHTML += `

                <div class="report-item">

                    <div class="d-flex justify-content-between flex-wrap gap-3">

                        <div>

                            <h5 class="fw-bold">

                                ${report.title}

                            </h5>

                            <p class="text-muted mb-2">

                                ${report.category}

                            </p>

                            <p>

                                ${report.description}

                            </p>

                            ${
                                report.imageUrl
                                ?
                                `
                                <img
                                    src="${report.imageUrl}"
                                    class="report-image">
                                `
                                :
                                ""
                            }

                            <div class="mt-3">

                                <strong>
                                    Admin Response:
                                </strong>

                                <p class="text-muted">

                                    ${
                                        report.adminResponse ||
                                        "No response yet."
                                    }

                                </p>

                            </div>

                        </div>

                        <div>

                            <span class="status-badge ${badgeClass}">

                                ${report.status.toUpperCase()}

                            </span>

                        </div>

                    </div>

                </div>

            `;
        });

    });

});

        // =====================================================
// SIMPLE REALTIME NOTIFICATIONS
// =====================================================

onAuthStateChanged(auth, (user) => {

    if (!user) return;

    const notificationsQuery = query(

        collection(db, "notifications"),

        where("studentId", "==", user.uid),

        orderBy("createdAt", "desc")

    );

    onSnapshot(notificationsQuery, (snapshot) => {

        notificationsWrapper.innerHTML = "";

        if (snapshot.empty) {

            notificationsWrapper.innerHTML = `

                <div class="text-muted">
                    No notifications yet.
                </div>

            `;

            return;
        }

        snapshot.forEach((docSnap) => {

            const notification = docSnap.data();

            notificationsWrapper.innerHTML += `

                <div class="notification-card">

                    <p class="fw-semibold mb-1">
                        ${notification.message}
                    </p>

                    <small class="text-muted">
                        ${notification.status}
                    </small>

                </div>

            `;

        });

    });

});
