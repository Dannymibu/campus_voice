<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Campus Voice</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {

            min-height: 100vh;

            background:
                linear-gradient(rgba(13, 59, 102, 0.88), rgba(13, 59, 102, 0.88)),
                url("talk-to-us.png");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: 'Segoe UI', sans-serif;
        }

        .auth-card {

            width: 100%;
            max-width: 1100px;

            overflow: hidden;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(18px);

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .left-side {

            padding: 60px;
            color: white;
        }

        .left-side h1 {

            font-size: 3.2rem;
            font-weight: bold;
            line-height: 1.1;
        }

        .left-side p {

            margin-top: 20px;
            color: rgba(255, 255, 255, 0.85);
        }

        .info-box {

            background: rgba(255, 255, 255, 0.14);

            padding: 18px;

            border-radius: 18px;

            margin-top: 20px;
        }

        .right-side {

            background: white;
            padding: 50px;
        }

        .form-control {

            border-radius: 14px;
            padding: 14px;
        }

        .form-control:focus {

            box-shadow: none;
            border-color: #2bbcd3;
        }

        .main-btn {

            background: #2bbcd3;
            border: none;

            padding: 14px;

            width: 100%;

            border-radius: 14px;

            color: rgb(255, 253, 253);

            font-weight: 600;
        }

        .main-btn:hover {

            background: #24a6bb;
        }
    </style>

</head>

<body>

    <div class="auth-card">

        <div class="row g-0">

            <div class="col-lg-5">

                <div class="left-side">

                    <h1>
                        Join
                        Campus Voice
                    </h1>

                    <p>
                        Create your student account and help improve campus life through real-time issue reporting.
                    </p>

                    <div class="info-box">
                        Real-time report tracking
                    </div>

                    <div class="info-box">
                        Anonymous reporting available
                    </div>

                    <div class="info-box">
                        Receive live admin updates
                    </div>

                </div>

            </div>

            <div class="col-lg-7">

                <div class="right-side">

                    <h3 class="fw-bold mb-4">
                        Create Account
                    </h3>

                    <form id="registerForm">

                        <div class="mb-3">
                            <input type="text" id="full_name" class="form-control" placeholder="Full Name" required>
                        </div>

                        <div class="mb-3">
                            <input type="text" id="student_id" class="form-control" placeholder="Student ID" required>
                        </div>

                        <div class="mb-3">
                            <input type="email" id="email" class="form-control" placeholder="Email Address" required>
                        </div>

                        <div class="mb-3">
                            <input type="password" id="password" class="form-control" placeholder="Password" required>
                        </div>

                        <div class="mb-4">
                            <input type="password" id="confirm-password" class="form-control"
                                placeholder="Confirm Password" required>
                        </div>

                        <button type="submit" class="main-btn">
                            Register
                        </button>

                        <div class="text-center mt-4">

                            Already have an account?

                            <a href="login.html">
                                Login
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword
        }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        import {
            getFirestore,
            doc,
            setDoc
        }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {

            apiKey: "AIzaSyAbaeZwRPsO8MoeQ3iWsrcY-mqvpT4xhgc",

            authDomain: "campus-voice-3de0b.firebaseapp.com",

            projectId: "campus-voice-3de0b",

            storageBucket: "campus-voice-3de0b.firebasestorage.app",

            messagingSenderId: "788646502212",

            appId: "1:788646502212:web:d0aea180d70c0f59538111"

        };

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore
            (app);

        const registerForm =
            document.getElementById("registerForm");

        registerForm.addEventListener("submit", async (e) => {

            e.preventDefault();

            const full_name =
                document.getElementById("full_name").value;

            const student_id =
                document.getElementById("student_id").value;

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirm-password").value;

            if (password !== confirmPassword) {

                alert("Passwords do not match");

                return;
            }

            try {

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                const user = userCredential.user;

                await setDoc(doc(db, "students", student_id), {

                uid: user.uid,

                full_name: full_name,

                student_id: student_id,

                email: email,

                role: "student",

                createdAt: new Date()

            });
                alert("Account created successfully!");

                window.location.href = "login.html";

            } catch (error) {

                console.log(error);

                alert(error.message);
            }

        });

    </script>

</body>

</html>
