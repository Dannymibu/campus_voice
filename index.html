<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body style="max-height: fit-content; background-color: whitesmoke;">
    <header class=" pt-5 mb-0" style=" display: inline-block;"> <img style="max-width: 75px;" src="cavendish.png"
            alt="cavendish logo" class="img-fluid"></header>
    <div class="container  mb-3">
        <div class="row justify-content-center ">
            <form id="studentForm" style="max-width:530px; max-height: fit-content;"
                class=" pt-3 p-5 rounded shadow bg-light">
                <div class="text-center"><img class="img-fluid" style="max-width: 70px;" src="voice.png"
                        alt="megaphone"></div>
                <h4 class="mb-5 text-center"> cavendish voice</h4>
                <div class="mb-3">
                    <input class="form-control" type="text" name="full_name" id="full_name" required autofocus
                        placeholder="Daniel Mibu">
                    <label class="form-label" for="full_name"> enter your full name</label>
                </div>

                <div class="mb-3">
                    <input class="form-control" type="text" name="student_id" id="student_id" required
                        placeholder="104727">
                    <label class="form-label" for="student_id"> enter your student-id</label>
                </div>

                <div class="mb-3">
                    <input class="form-control" type="email" name="email" id="email" required placeholder="email">
                    <label class="form-label" for="email">email</label>
                </div>

                <div class="mb-3">
                    <input class="form-control" type="password" name="password" id="password" required
                        placeholder="password">
                    <label class="form-label" for="password">password</label>
                </div>

                <div class="mb-3">
                    <input class="form-control" type="password" name="confirm-password" id="confirm-password" required
                        placeholder="confirm-password">
                    <label class="form-label" for="confirm-password">confirm-password</label>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-success">Register</button>
                </div>
                <div class=" form-text text-center mt-3">
                    <hr>
                    <h5>Already Have an account? <a href="login.html"> Login</a></h5>
                </div>

            </form>
        </div>


    </div>

    <script type="module">

        // FIREBASE IMPORTS
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            updatePassword
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        import {
            getFirestore,
            collection,
            query,
            where,
            getDocs,
            doc,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // FIREBASE CONFIG
        const firebaseConfig = {

            apiKey: "AIzaSyAbaeZwRPsO8MoeQ3iWsrcY-mqvpT4xhgc",
            authDomain: "campus-voice-3de0b.firebaseapp.com",
            projectId: "campus-voice-3de0b",
            storageBucket: "campus-voice-3de0b.firebasestorage.app",
            messagingSenderId: "788646502212",
            appId: "1:788646502212:web:d0aea180d70c0f59538111"


        };

        // INITIALIZE FIREBASE
        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);

        let studentDocId = "";

        // CHECK LOGGED IN USER
        onAuthStateChanged(auth, async (user) => {

            if (user) {

                const q = query(
                    collection(db, "students"),
                    where("uid", "==", user.uid)
                );

                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {

                    const studentDoc = querySnapshot.docs[0];

                    studentDocId = studentDoc.id;

                    const userData = studentDoc.data();

                    // SET VALUES INTO INPUTS
                    document.getElementById("nameInput").value =
                        userData.full_name || "";

                    document.getElementById("emailInput").value =
                        userData.email || "";

                    document.getElementById("courseInput").value =
                        userData.course || "";

                    document.getElementById("phoneInput").value =
                        userData.phone || "";

                }

            } else {

                window.location.href = "login.html";

            }

        });

        // SAVE BUTTON
        document.getElementById("saveBtn")
            .addEventListener("click", async () => {

                const fullName =
                    document.getElementById("nameInput").value;

                const course =
                    document.getElementById("courseInput").value;

                const phone =
                    document.getElementById("phoneInput").value;

                const password =
                    document.getElementById("passwordInput").value;

                try {

                    // UPDATE FIRESTORE
                    await updateDoc(doc(db, "students", studentDocId), {

                        full_name: fullName,

                        course: course,

                        phone: phone

                    });

                    // UPDATE PASSWORD
                    if (password !== "") {

                        await updatePassword(auth.currentUser, password);

                    }

                    alert("Account updated successfully!");

                } catch (error) {

                    console.log(error);

                    alert(error.message);

                }

            });

    </script>

</body>

</html>
